  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const mk = (parent, tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
        return el;
      };
      // seeded PRNG so every render is identical
      let seed = 20261031;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      // shoji lattice
      const win = document.getElementById("ry-windows");
      [[965, 115], [1110, 115], [1255, 115], [1400, 105]].forEach(([x, w], i) => {
        const t = 4.8 + i * 0.35;
        mk(win, "rect", { class: "ink thin", pathLength: 1, "data-draw": `${t},1.4`, x, y: 490, width: w, height: 110 });
        let d = "";
        for (let k = 1; k < 3; k++) d += `M ${x + (w * k) / 3} 490 L ${x + (w * k) / 3} 600 `;
        for (let k = 1; k < 4; k++) d += `M ${x} ${490 + 27.5 * k} L ${x + w} ${490 + 27.5 * k} `;
        mk(win, "path", { class: "ink thin", pathLength: 1, "data-draw": `${t + 0.6},1.6`, d, style: "stroke-width:1.2" });
      });

      // bamboo fence
      const fence = document.getElementById("ry-fence");
      let posts = "";
      for (let x = 1180; x <= 1560; x += 13) posts += `M ${x} ${700 + (x % 3)} L ${x} 768 `;
      mk(fence, "rect", { class: "paperfill", "data-fill": "7,1.6", x: 1180, y: 700, width: 380, height: 68 });
      mk(fence, "path", { class: "ink thin", pathLength: 1, "data-draw": "7.2,2.2", d: posts, style: "stroke-width:1.4" });
      mk(fence, "path", { class: "ink", pathLength: 1, "data-draw": "7,1.6", d: "M 1170 714 L 1570 714 M 1170 752 L 1570 752", style: "stroke-width:2.4" });
      document.getElementById("ry-fencecap").setAttribute(
        "d",
        "M 1174 704 Q 1220 688 1280 696 Q 1340 686 1400 696 Q 1460 688 1520 696 Q 1550 692 1566 704 Q 1370 712 1174 704 Z"
      );

      // rocks around the bath
      const rocks = document.getElementById("ry-rocks");
      const caps = document.getElementById("ry-rockcaps");
      const R = [
        [560, 815, 120, 60], [700, 796, 140, 54], [860, 792, 130, 50], [1000, 806, 120, 56],
        [470, 870, 110, 70], [1110, 842, 110, 70], [1150, 925, 104, 72], [440, 955, 124, 72],
        [1036, 982, 150, 62], [600, 1000, 130, 56],
      ];
      R.forEach(([cx, cy, w, h], i) => {
        const d =
          `M ${cx - w / 2} ${cy + h / 2} Q ${cx - w / 2 - 6} ${cy - h / 4} ${cx - w / 5} ${cy - h / 2} ` +
          `Q ${cx + w / 4} ${cy - h / 2 - 6} ${cx + w / 2} ${cy - h / 6} Q ${cx + w / 2 + 6} ${cy + h / 3} ${cx + w / 3} ${cy + h / 2} Z`;
        mk(rocks, "path", { class: "ink paper", pathLength: 1, "data-draw": `${7 + i * 0.22},1.4`, d });
        mk(rocks, "path", {
          class: "ink thin", pathLength: 1, "data-draw": `${7.6 + i * 0.22},1`,
          d: `M ${cx - w / 8} ${cy - h / 6} Q ${cx} ${cy + h / 8} ${cx + w / 6} ${cy + h / 4}`,
        });
        mk(caps, "path", {
          class: "snowcap",
          d:
            `M ${cx - w / 2 + 6} ${cy - h / 8} Q ${cx - w / 5} ${cy - h / 2 - 5} ${cx + w / 5} ${cy - h / 2 - 6} ` +
            `Q ${cx + w / 2} ${cy - h / 3} ${cx + w / 2 - 2} ${cy - h / 10} Q ${cx} ${cy - h / 4} ${cx - w / 2 + 6} ${cy - h / 8} Z`,
        });
      });

      // steam wisps
      const steamG = document.getElementById("ry-steam");
      const steam = [600, 690, 780, 870, 960, 1050].map((x, i) => {
        const p = mk(steamG, "path", {
          class: "steam",
          d: "M 0 0 C -16 -30 16 -60 0 -90 C -16 -120 14 -150 0 -180",
          opacity: 0,
        });
        return { el: p, x, y: 900 - (i % 2) * 30, ph: rand(), per: 5.5 + rand() * 2 };
      });

      // falling snow: positions are a pure function of time t
      const flakes = [];
      const addFlakes = (g, n, rMin, rMax, vMin, vMax) => {
        for (let i = 0; i < n; i++) {
          const r = rMin + rand() * (rMax - rMin);
          flakes.push({
            el: mk(g, "circle", { class: "flake", r: r.toFixed(2), cx: 0, cy: 0 }),
            x0: rand() * 2000 - 40, y0: rand() * 1200, v: vMin + rand() * (vMax - vMin),
            amp: 10 + rand() * 30, w: 0.3 + rand() * 0.6, ph: rand() * 6.28,
          });
        }
      };
      addFlakes(document.getElementById("ry-back-snow"), 110, 1.2, 2.6, 28, 48);
      addFlakes(document.getElementById("ry-front-snow"), 70, 2.8, 5.2, 55, 90);

      const clamp = (v) => Math.max(0, Math.min(1, v));
      const render = (t) => {
        const snowIn = clamp(t / 2.5);
        for (const f of flakes) {
          const y = ((f.y0 + t * f.v) % 1200) - 60;
          const x = f.x0 + Math.sin(t * f.w + f.ph) * f.amp;
          f.el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
          f.el.setAttribute("opacity", snowIn.toFixed(3));
        }
        const steamIn = clamp((t - 9.5) / 3);
        for (const s of steam) {
          const u = (t / s.per + s.ph) % 1;
          const op = Math.sin(Math.PI * u) * 0.6 * steamIn;
          const sx = 0.8 + u * 0.6;
          s.el.setAttribute(
            "transform",
            `translate(${(s.x + Math.sin(u * 3 + s.ph * 6) * 8).toFixed(1)} ${(s.y - u * 120).toFixed(1)}) scale(${sx.toFixed(3)} 1)`
          );
          s.el.setAttribute("opacity", op.toFixed(3));
        }
      };

      const tl = gsap.timeline({ paused: true });

      // line drawing: each stroke reveals over its own [start, duration]
      document.querySelectorAll('#root [data-draw]').forEach((el) => {
        const [s, d] = el.getAttribute("data-draw").split(",").map(Number);
        tl.fromTo(el, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, s);
        if (el.matches(".paper, .water"))
          tl.fromTo(el, { fillOpacity: 0 }, { fillOpacity: 1, duration: d, ease: "sine.inOut" }, s + d * 0.3);
      });
      document.querySelectorAll('#root [data-fill]').forEach((el) => {
        const [s, d] = el.getAttribute("data-fill").split(",").map(Number);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d, ease: "sine.inOut" }, s);
      });

      tl.fromTo("#ry-caps", { opacity: 0 }, { opacity: 1, duration: 2.4, ease: "sine.inOut" }, 9);
      tl.fromTo(".ry-glow", { opacity: 0 }, { opacity: 0.55, duration: 3.5, ease: "sine.inOut" }, 10.5);

      tl.fromTo("#ry-title", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 2.6, ease: "sine.out" }, 12.5);
      tl.fromTo("#ry-seal", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 14.2);
      tl.to(["#ry-title", "#ry-seal"], { opacity: 0, duration: 2, ease: "sine.inOut" }, 24.5);

      // slow camera drift
      tl.fromTo("#ry-cam", { scale: 1, x: 0 }, { scale: 1.07, x: -24, duration: 30, ease: "sine.inOut" }, 0);

      // snow + steam clock
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 30, duration: 30, ease: "none", onUpdate: () => render(clock.t) }, 0);

      tl.fromTo("#ry-fade", { opacity: 0 }, { opacity: 1, duration: 2, ease: "sine.inOut" }, 27.9);

      render(0);
      window.__timelines["ryokan"] = tl;
    })();
  </script>
